<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Ale Brokering</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: { 50:'#e6f0ff',100:'#b3d1ff',200:'#80b3ff',300:'#4d94ff',400:'#1a75ff',500:'#0052cc',600:'#0A2540',700:'#081c30',800:'#061424',900:'#040c18' } } } }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <header class="bg-primary-600 text-white py-4">
    <div class="container mx-auto px-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center">
          <i class="fas fa-building text-primary-600"></i>
        </div>
        <span class="font-bold text-lg">Ale Brokering</span>
      </a>
      <div class="relative">
        <button id="langBtn" class="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-primary-700 text-sm">
          <i class="fas fa-globe"></i> <span id="currentLang">EN</span>
        </button>
        <div id="langMenu" class="hidden absolute right-0 mt-2 w-32 bg-white text-gray-800 rounded-lg shadow-xl py-1 z-50">
          <button onclick="setLanguage('en')" class="w-full text-left px-4 py-2 hover:bg-gray-100">English</button>
          <button onclick="setLanguage('am')" class="w-full text-left px-4 py-2 hover:bg-gray-100">አማርኛ</button>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 w-full max-w-md p-8">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-primary-100 rounded-full flex items-center justify-center mx-auto mb-4">
          <i class="fas fa-user-plus text-2xl text-primary-600"></i>
        </div>
        <h1 class="text-2xl font-bold text-primary-600">Sign Up</h1>
        <p class="text-gray-500 mt-1">Create your Ale Brokering account</p>
      </div>

      <form onsubmit="handleRegisterWithTerms(event)">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
          <input type="text" id="regName" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5" placeholder="Your full name">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="regEmail" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5" placeholder="you@example.com">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
          <input type="tel" id="regPhone" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5" placeholder="+251 9xx xxx xxx">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" id="regPassword" required minlength="6" class="w-full border border-gray-300 rounded-lg px-4 py-2.5" placeholder="Min 6 characters">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
          <input type="password" id="regConfirm" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5" placeholder="Repeat password">
        </div>

        <!-- Terms & Conditions -->
        <div class="mb-6 p-4 bg-gray-50 border border-gray-200 rounded-lg">
          <p class="text-sm text-gray-700 mb-3">
            Please read and accept our 
            <a href="terms.html" target="_blank" class="text-primary-600 underline font-medium">Terms & Conditions</a> 
            and 
            <a href="privacy.html" target="_blank" class="text-primary-600 underline font-medium">Privacy Policy</a>.
          </p>
          <div class="flex gap-3">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="terms" id="termsAccept" value="accept" required class="w-4 h-4 text-primary-600">
              <span class="text-sm font-medium text-green-700">Accept</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="terms" id="termsDecline" value="decline" class="w-4 h-4 text-red-600">
              <span class="text-sm font-medium text-red-600">Decline</span>
            </label>
          </div>
        </div>

        <button type="submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 rounded-lg">Create Account</button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-6">
        Already have an account?
        <a href="login.html" class="text-primary-600 font-medium hover:underline">Sign In</a>
      </p>
    </div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function handleRegisterWithTerms(e) {
      e.preventDefault();
      const accepted = document.getElementById('termsAccept').checked;
      if (!accepted) {
        alert('You must Accept the Terms & Conditions and Privacy Policy to create an account.');
        return;
      }
      handleRegister(e);
    }
  </script>
</body>
</html>
