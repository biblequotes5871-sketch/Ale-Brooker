<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wanted | Ale Brokering</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:{50:'#e6f0ff',100:'#b3d1ff',200:'#80b3ff',300:'#4d94ff',400:'#1a75ff',500:'#0052cc',600:'#0A2540',700:'#081c30',800:'#061424',900:'#040c18'}}}}}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50">
  <header class="bg-primary-600 text-white sticky top-0 z-50 shadow-lg">
    <div class="container mx-auto px-4">
      <div class="flex items-center justify-between py-3">
        <a href="index.html" class="flex items-center gap-3">
          <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center"><i class="fas fa-building text-primary-600 text-xl"></i></div>
          <div><h1 class="text-lg font-bold" data-i18n="company_name">Ale Brokering</h1><p class="text-xs text-blue-200" data-i18n="company_tagline">& Commission Company</p></div>
        </a>
        <nav class="hidden lg:flex items-center gap-6">
          <a href="index.html" class="hover:text-blue-200" data-i18n="nav_home">Home</a>
          <a href="properties.html" class="hover:text-blue-200" data-i18n="nav_properties">Properties</a>
          <a href="wanted.html" class="text-blue-200 font-medium" data-i18n="nav_wanted">Wanted</a>
          <a href="projects.html" class="hover:text-blue-200" data-i18n="nav_projects">Projects</a>
          <a href="experts.html" class="hover:text-blue-200" data-i18n="nav_experts">Experts</a>
          <a href="login.html?redirect=post" class="hover:text-blue-200" data-i18n="nav_post">Post Listing</a>
        </nav>
        <div class="flex items-center gap-3">
          <div class="relative">
            <button id="langBtn" class="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-primary-700 text-sm"><i class="fas fa-globe"></i> <span id="currentLang">EN</span></button>
            <div id="langMenu" class="hidden absolute right-0 mt-2 w-32 bg-white text-gray-800 rounded-lg shadow-xl py-1 z-50">
              <button onclick="setLanguage('en')" class="w-full text-left px-4 py-2 hover:bg-gray-100">English</button>
              <button onclick="setLanguage('am')" class="w-full text-left px-4 py-2 hover:bg-gray-100">አማርኛ</button>
            </div>
          </div>
          <div id="authButtons" class="flex items-center gap-2">
            <a href="login.html" class="px-4 py-1.5 text-sm border border-white rounded-lg" data-i18n="nav_login">Sign In</a>
          </div>
          <div id="userMenu" class="hidden relative">
            <button id="userBtn" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-primary-700"><i class="fas fa-user-circle"></i> <span id="userName" class="text-sm"></span></button>
            <div id="userDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white text-gray-800 rounded-lg shadow-xl py-1 z-50">
              <a href="dashboard.html" class="block px-4 py-2 hover:bg-gray-100" data-i18n="nav_dashboard">Dashboard</a>
              <a href="admin.html" id="adminLink" class="hidden block px-4 py-2 hover:bg-gray-100" data-i18n="nav_admin">Admin Panel</a>
              <button onclick="logout()" class="w-full text-left px-4 py-2 hover:bg-gray-100 text-red-600" data-i18n="nav_logout">Logout</button>
            </div>
          </div>
          <button id="mobileMenuBtn" class="lg:hidden p-2"><i class="fas fa-bars text-xl"></i></button>
        </div>
      </div>
    </div>
    <div id="mobileNav" class="hidden lg:hidden bg-primary-700 border-t border-primary-500">
      <nav class="container mx-auto px-4 py-3 flex flex-col gap-2">
        <a href="index.html" class="py-2" data-i18n="nav_home">Home</a>
        <a href="properties.html" class="py-2" data-i18n="nav_properties">Properties</a>
        <a href="wanted.html" class="py-2" data-i18n="nav_wanted">Wanted</a>
        <a href="projects.html" class="py-2" data-i18n="nav_projects">Projects</a>
        <a href="experts.html" class="py-2" data-i18n="nav_experts">Experts</a>
        <a href="login.html?redirect=post" class="py-2" data-i18n="nav_post">Post Listing</a>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-4 py-10">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-primary-600" data-i18n="wanted_title">Wanted Properties</h1>
        <p class="text-gray-500" data-i18n="wanted_subtitle">People looking to buy or rent</p>
      </div>
      <a href="post-wanted.html" class="inline-flex items-center gap-2 bg-primary-600 hover:bg-primary-700 text-white font-medium px-5 py-2.5 rounded-lg">
        <i class="fas fa-plus"></i> <span data-i18n="post_wanted">Post Wanted Request</span>
      </a>
    </div>

    <div id="wantedList" class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <!-- JS -->
    </div>
  </main>

  <footer class="bg-primary-900 text-white py-6 mt-12">
    <div class="container mx-auto px-4 text-center text-sm text-blue-300">
      <p>&copy; 2026 Ale Brokering and Commission Company.</p>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initApp();
      const list = getWanted();
      const container = document.getElementById('wantedList');
      if (list.length === 0) {
        container.innerHTML = '<p class="text-gray-500 col-span-2 text-center py-12">No wanted requests yet.</p>';
        return;
      }
      container.innerHTML = list.map(w => `
        <div class="bg-white rounded-xl shadow-md border border-gray-100 p-5">
          <div class="flex items-start justify-between mb-3">
            <h3 class="font-semibold text-lg text-gray-900">${w.title}</h3>
            <span class="text-xs px-2 py-1 rounded-full ${w.purpose==='sale'?'bg-blue-100 text-blue-700':'bg-green-100 text-green-700'}">${w.purpose==='sale'?'Buy':'Rent'}</span>
          </div>
          <p class="text-sm text-gray-500 mb-2"><i class="fas fa-map-marker-alt mr-1 text-primary-600"></i>${w.location}</p>
          <p class="text-sm text-gray-600 mb-3 line-clamp-2">${w.description}</p>
          <div class="flex items-center justify-between pt-3 border-t border-gray-100">
            <div>
              <span class="text-primary-600 font-bold">Up to ${formatPrice(w.maxPrice)}</span>
              ${w.bedrooms > 0 ? `<span class="text-xs text-gray-500 ml-2">${w.bedrooms} beds</span>` : ''}
            </div>
            <a href="tel:${w.phone}" class="text-sm bg-primary-600 hover:bg-primary-700 text-white px-4 py-1.5 rounded-lg">Contact</a>
          </div>
          <p class="text-xs text-gray-400 mt-2">Posted by ${w.userName} • ${w.createdAt}</p>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
