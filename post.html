<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Listing | Ale Brokering</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: { 50:'#e6f0ff',100:'#b3d1ff',200:'#80b3ff',300:'#4d94ff',400:'#1a75ff',500:'#0052cc',600:'#0A2540',700:'#081c30',800:'#061424',900:'#040c18' } } } }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50">
  <header class="bg-primary-600 text-white sticky top-0 z-50 shadow-lg">
    <div class="container mx-auto px-4">
      <div class="flex items-center justify-between py-3">
        <a href="index.html" class="flex items-center gap-3">
          <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center">
            <i class="fas fa-building text-primary-600 text-xl"></i>
          </div>
          <div>
            <h1 class="text-lg font-bold" data-i18n="company_name">Ale Brokering</h1>
            <p class="text-xs text-blue-200" data-i18n="company_tagline">& Commission Company</p>
          </div>
        </a>
        <nav class="hidden lg:flex items-center gap-6">
          <a href="index.html" class="hover:text-blue-200" data-i18n="nav_home">Home</a>
          <a href="properties.html" class="hover:text-blue-200" data-i18n="nav_properties">Properties</a>
          <a href="wanted.html" class="hover:text-blue-200" data-i18n="nav_wanted">Wanted</a>
          <a href="projects.html" class="hover:text-blue-200" data-i18n="nav_projects">Projects</a>
          <a href="experts.html" class="hover:text-blue-200" data-i18n="nav_experts">Experts</a>
          <a href="post.html" class="text-blue-200 font-medium" data-i18n="nav_post">Post Listing</a>
        </nav>
        <div class="flex items-center gap-3">
          <div class="relative">
            <button id="langBtn" class="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-primary-700 text-sm">
              <i class="fas fa-globe"></i> <span id="currentLang">EN</span>
            </button>
            <div id="langMenu" class="hidden absolute right-0 mt-2 w-32 bg-white text-gray-800 rounded-lg shadow-xl py-1 z-50">
              <button onclick="setLanguage('en')" class="w-full text-left px-4 py-2 hover:bg-gray-100">English</button>
              <button onclick="setLanguage('am')" class="w-full text-left px-4 py-2 hover:bg-gray-100">አማርኛ</button>
            </div>
          </div>
          <div id="authButtons" class="flex items-center gap-2">
            <a href="login.html" class="px-4 py-1.5 text-sm border border-white rounded-lg" data-i18n="nav_login">Sign In</a>
          </div>
          <div id="userMenu" class="hidden relative">
            <button id="userBtn" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-primary-700">
              <i class="fas fa-user-circle"></i> <span id="userName" class="text-sm"></span>
            </button>
            <div id="userDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white text-gray-800 rounded-lg shadow-xl py-1 z-50">
              <a href="dashboard.html" class="block px-4 py-2 hover:bg-gray-100"><span data-i18n="nav_dashboard">Dashboard</span></a>
              <a href="admin.html" id="adminLink" class="hidden block px-4 py-2 hover:bg-gray-100"><span data-i18n="nav_admin">Admin Panel</span></a>
              <button onclick="logout()" class="w-full text-left px-4 py-2 hover:bg-gray-100 text-red-600"><span data-i18n="nav_logout">Logout</span></button>
            </div>
          </div>
          <button id="mobileMenuBtn" class="lg:hidden p-2"><i class="fas fa-bars text-xl"></i></button>
        </div>
      </div>
    </div>
    <div id="mobileNav" class="hidden lg:hidden bg-primary-700 border-t border-primary-500">
      <nav class="container mx-auto px-4 py-3 flex flex-col gap-2">
        <a href="index.html" class="py-2" data-i18n="nav_home">Home</a>
        <a href="properties.html" class="py-2" data-i18n="nav_properties">Properties</a>
        <a href="wanted.html" class="py-2" data-i18n="nav_wanted">Wanted</a>
        <a href="projects.html" class="py-2" data-i18n="nav_projects">Projects</a>
        <a href="experts.html" class="py-2" data-i18n="nav_experts">Experts</a>
        <a href="post.html" class="py-2" data-i18n="nav_post">Post Listing</a>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-4 py-10 max-w-3xl">
    <div class="text-center mb-8">
      <h1 class="text-2xl md:text-3xl font-bold text-primary-600" data-i18n="post_title">Post a Listing</h1>
      <p class="text-gray-500 mt-1" data-i18n="post_subtitle">Fill in all details carefully</p>
      <p class="text-sm text-amber-600 mt-2 bg-amber-50 inline-block px-4 py-2 rounded-lg">
        <i class="fas fa-info-circle mr-1"></i> All listings require admin approval before they appear publicly.
      </p>
    </div>

    <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-6 md:p-8">
      <form onsubmit="handlePostListing(event)">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="title_label">Title</label>
            <input type="text" id="postTitle" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5" placeholder="e.g. Modern 4-bedroom Villa in Bole">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="property_type">Property Type</label>
            <select id="postType" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5">
              <option value="property">Property</option>
              <option value="villa">Villa</option>
              <option value="condo">Condominium</option>
              <option value="guest_house">Guest House</option>
              <option value="land">Land</option>
              <option value="store">Store</option>
              <option value="building">Building</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="purpose">Purpose</label>
            <select id="postPurpose" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5">
              <option value="sale">For Sale</option>
              <option value="rent">For Rent</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="price">Price (ETB)</label>
            <input type="number" id="postPrice" required min="0" class="w-full border border-gray-300 rounded-lg px-4 py-2.5" placeholder="e.g. 15000000">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="location">Location</label>
            <input type="text" id="postLocation" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5" placeholder="e.g. Bole, Addis Ababa">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="bedrooms">Bedrooms</label>
            <input type="number" id="postBedrooms" min="0" class="w-full border border-gray-300 rounded-lg px-4 py-2.5" placeholder="0 for land/store">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="bathrooms">Bathrooms</label>
            <input type="number" id="postBathrooms" min="0" class="w-full border border-gray-300 rounded-lg px-4 py-2.5" placeholder="0 if none">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="area">Area (m²)</label>
            <input type="number" id="postArea" min="0" class="w-full border border-gray-300 rounded-lg px-4 py-2.5" placeholder="e.g. 250">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Image URL (optional)</label>
            <input type="url" id="postImage" class="w-full border border-gray-300 rounded-lg px-4 py-2.5" placeholder="https://...">
          </div>

          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="description">Description</label>
            <textarea id="postDescription" required rows="5" class="w-full border border-gray-300 rounded-lg px-4 py-2.5" placeholder="Provide full detailed information about the property..."></textarea>
          </div>
        </div>

        <div class="mt-6 flex gap-3">
          <button type="submit" class="flex-1 bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 rounded-lg" data-i18n="submit_listing">Submit Listing</button>
          <a href="index.html" class="px-6 py-3 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50" data-i18n="cancel">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initApp();
      if (!getCurrentUser()) {
        alert('Please Sign In to post a listing.');
        window.location.href = 'login.html?redirect=post';
      }
    });
  </script>
</body>
</html>
