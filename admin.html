<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Ale Brokering</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:{50:'#e6f0ff',100:'#b3d1ff',200:'#80b3ff',300:'#4d94ff',400:'#1a75ff',500:'#0052cc',600:'#0A2540',700:'#081c30',800:'#061424',900:'#040c18'}}}}}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50">
  <header class="bg-primary-600 text-white sticky top-0 z-50 shadow-lg">
    <div class="container mx-auto px-4">
      <div class="flex items-center justify-between py-3">
        <a href="index.html" class="flex items-center gap-3">
          <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center"><i class="fas fa-building text-primary-600 text-xl"></i></div>
          <div><h1 class="text-lg font-bold">Admin Panel</h1></div>
        </a>
        <div class="flex items-center gap-3">
          <a href="index.html" class="text-sm hover:text-blue-200">Back to Site</a>
          <button onclick="logout()" class="text-sm bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-primary-600 mb-6" data-i18n="admin_title">Admin Panel</h1>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-white rounded-xl p-5 shadow border text-center">
        <div class="text-2xl font-bold text-primary-600" id="adminListings">0</div>
        <div class="text-sm text-gray-500">Total Listings</div>
      </div>
      <div class="bg-white rounded-xl p-5 shadow border text-center">
        <div class="text-2xl font-bold text-yellow-600" id="adminPending">0</div>
        <div class="text-sm text-gray-500">Pending Approval</div>
      </div>
      <div class="bg-white rounded-xl p-5 shadow border text-center">
        <div class="text-2xl font-bold text-green-600" id="adminUsers">0</div>
        <div class="text-sm text-gray-500">Users</div>
      </div>
      <div class="bg-white rounded-xl p-5 shadow border text-center">
        <div class="text-2xl font-bold text-blue-600" id="adminWanted">0</div>
        <div class="text-sm text-gray-500">Wanted Requests</div>
      </div>
    </div>

    <h2 class="font-semibold text-lg mb-4">Pending Listings</h2>
    <div id="pendingList" class="space-y-3 mb-10">
      <!-- JS -->
    </div>

    <h2 class="font-semibold text-lg mb-4">All Users</h2>
    <div class="bg-white rounded-xl shadow border overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-left">
          <tr>
            <th class="px-4 py-3">Name</th>
            <th class="px-4 py-3">Email</th>
            <th class="px-4 py-3">Phone</th>
            <th class="px-4 py-3">Role</th>
          </tr>
        </thead>
        <tbody id="usersTable">
          <!-- JS -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Secure admin gate - runs immediately
    (function secureAdmin() {
      const user = getCurrentUser();
      if (!user || user.role !== 'admin') {
        document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;background:#f8fafc;"><div style="text-align:center;"><h1 style="color:#0A2540;">Access Denied</h1><p>Admin login required.</p><a href="login.html" style="color:#0052cc;">Go to Sign In</a></div></div>';
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        return;
      }
    })();

    document.addEventListener('DOMContentLoaded', () => {
      const user = getCurrentUser();
      if (!user || user.role !== 'admin') return;

      const listings = getListings();
      const pending = listings.filter(l => l.status === 'pending');
      const users = getUsers();
      const wanted = getWanted();

      document.getElementById('adminListings').textContent = listings.length;
      document.getElementById('adminPending').textContent = pending.length;
      document.getElementById('adminUsers').textContent = users.length;
      document.getElementById('adminWanted').textContent = wanted.length;

      const pendingEl = document.getElementById('pendingList');
      if (pending.length === 0) {
        pendingEl.innerHTML = '<p class="text-gray-500">No pending listings.</p>';
      } else {
        pendingEl.innerHTML = pending.map(l => `
          <div class="bg-white rounded-lg border p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <p class="font-medium">${l.title}</p>
              <p class="text-sm text-gray-500">${getTypeLabel(l.type)} • ${l.location} • ${formatPrice(l.price)} • by ${l.userName}</p>
            </div>
            <div class="flex gap-2">
              <button onclick="approveListing(${l.id})" class="bg-green-600 hover:bg-green-700 text-white text-sm px-4 py-1.5 rounded-lg">Approve</button>
              <button onclick="rejectListing(${l.id})" class="bg-red-600 hover:bg-red-700 text-white text-sm px-4 py-1.5 rounded-lg">Reject</button>
            </div>
          </div>
        `).join('');
      }

      document.getElementById('usersTable').innerHTML = users.map(u => `
        <tr class="border-t">
          <td class="px-4 py-3">${u.name}</td>
          <td class="px-4 py-3">${u.email}</td>
          <td class="px-4 py-3">${u.phone || '-'}</td>
          <td class="px-4 py-3"><span class="text-xs px-2 py-1 rounded-full ${u.role==='admin'?'bg-purple-100 text-purple-700':'bg-gray-100 text-gray-700'}">${u.role}</span></td>
        </tr>
      `).join('');
    });

    function approveListing(id) {
      const listings = getListings();
      const idx = listings.findIndex(l => l.id === id);
      if (idx >= 0) {
        listings[idx].status = 'approved';
        saveListings(listings);
        location.reload();
      }
    }

    function rejectListing(id) {
      const listings = getListings().filter(l => l.id !== id);
      saveListings(listings);
      location.reload();
    }
  </script>
</body>
</html>
