<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Ale Brokering</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:{50:'#e6f0ff',100:'#b3d1ff',200:'#80b3ff',300:'#4d94ff',400:'#1a75ff',500:'#0052cc',600:'#0A2540',700:'#081c30',800:'#061424',900:'#040c18'}}}}}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50">
  <header class="bg-primary-600 text-white sticky top-0 z-50 shadow-lg">
    <div class="container mx-auto px-4">
      <div class="flex items-center justify-between py-3">
        <a href="index.html" class="flex items-center gap-3">
          <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center"><i class="fas fa-building text-primary-600 text-xl"></i></div>
          <div><h1 class="text-lg font-bold" data-i18n="company_name">Ale Brokering</h1></div>
        </a>
        <div class="flex items-center gap-3">
          <div class="relative">
            <button id="langBtn" class="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-primary-700 text-sm"><i class="fas fa-globe"></i> <span id="currentLang">EN</span></button>
            <div id="langMenu" class="hidden absolute right-0 mt-2 w-32 bg-white text-gray-800 rounded-lg shadow-xl py-1 z-50">
              <button onclick="setLanguage('en')" class="w-full text-left px-4 py-2 hover:bg-gray-100">English</button>
              <button onclick="setLanguage('am')" class="w-full text-left px-4 py-2 hover:bg-gray-100">አማርኛ</button>
            </div>
          </div>
          <div id="userMenu" class="relative">
            <button id="userBtn" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-primary-700"><i class="fas fa-user-circle"></i> <span id="userName" class="text-sm"></span></button>
            <div id="userDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white text-gray-800 rounded-lg shadow-xl py-1 z-50">
              <a href="dashboard.html" class="block px-4 py-2 hover:bg-gray-100">Dashboard</a>
              <a href="admin.html" id="adminLink" class="hidden block px-4 py-2 hover:bg-gray-100">Admin Panel</a>
              <button type="button" onclick="logout()" class="w-full text-left px-4 py-2 hover:bg-gray-100 text-red-600">Logout</button>
            </div>
          </div>
          <button type="button" onclick="logout()" class="px-3 py-1.5 text-sm bg-red-600 hover:bg-red-700 rounded-lg">
            <i class="fas fa-sign-out-alt mr-1"></i> Logout
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-primary-600 mb-6" data-i18n="dashboard_title">My Dashboard</h1>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
      <a href="post.html" class="bg-white rounded-xl p-5 shadow border flex items-center gap-4 hover:shadow-md transition">
        <div class="w-12 h-12 bg-primary-100 rounded-lg flex items-center justify-center"><i class="fas fa-plus text-primary-600"></i></div>
        <div><p class="font-semibold">Post Listing</p><p class="text-xs text-gray-500">Sell or rent property</p></div>
      </a>
      <a href="post-wanted.html" class="bg-white rounded-xl p-5 shadow border flex items-center gap-4 hover:shadow-md transition">
        <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center"><i class="fas fa-search text-green-600"></i></div>
        <div><p class="font-semibold">Post Wanted</p><p class="text-xs text-gray-500">Looking to buy/rent</p></div>
      </a>
      <a href="properties.html" class="bg-white rounded-xl p-5 shadow border flex items-center gap-4 hover:shadow-md transition">
        <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center"><i class="fas fa-home text-blue-600"></i></div>
        <div><p class="font-semibold">Browse</p><p class="text-xs text-gray-500">Find properties</p></div>
      </a>
    </div>

    <h2 class="font-semibold text-lg mb-4" data-i18n="my_listings">My Listings</h2>
    <div id="myListings" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-10">
      <!-- JS -->
    </div>

    <h2 class="font-semibold text-lg mb-4" data-i18n="my_wanted">My Wanted Requests</h2>
    <div id="myWanted" class="space-y-3">
      <!-- JS -->
    </div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = getCurrentUser();
      if (!user) { window.location.href = 'login.html'; return; }
      initApp();
      // Ensure name shows
      const nameEl = document.getElementById('userName');
      if (nameEl) nameEl.textContent = user.name.split(' ')[0];
      const adminLink = document.getElementById('adminLink');
      if (adminLink && user.role === 'admin') adminLink.classList.remove('hidden');

      const myListings = getListings().filter(l => l.userId === user.id);
      const container = document.getElementById('myListings');
      if (myListings.length === 0) {
        container.innerHTML = '<p class="text-gray-500 col-span-3">You have no listings yet. <a href="post.html" class="text-primary-600 underline">Post one</a></p>';
      } else {
        container.innerHTML = myListings.map(l => createPropertyCard(l)).join('');
      }

      const myWanted = getWanted().filter(w => w.userId === user.id);
      const wContainer = document.getElementById('myWanted');
      if (myWanted.length === 0) {
        wContainer.innerHTML = '<p class="text-gray-500">No wanted requests yet.</p>';
      } else {
        wContainer.innerHTML = myWanted.map(w => `
          <div class="bg-white rounded-lg border p-4 flex justify-between items-center">
            <div>
              <p class="font-medium">${w.title}</p>
              <p class="text-sm text-gray-500">${w.location} • Up to ${formatPrice(w.maxPrice)}</p>
            </div>
            <span class="text-xs px-2 py-1 rounded-full bg-green-100 text-green-700">${w.status}</span>
          </div>
        `).join('');
      }
    });
  </script>
</body>
</html>
