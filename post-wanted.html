<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Wanted | Ale Brokering</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:{50:'#e6f0ff',100:'#b3d1ff',200:'#80b3ff',300:'#4d94ff',400:'#1a75ff',500:'#0052cc',600:'#0A2540',700:'#081c30',800:'#061424',900:'#040c18'}}}}}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50">
  <header class="bg-primary-600 text-white py-4">
    <div class="container mx-auto px-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center"><i class="fas fa-building text-primary-600"></i></div>
        <span class="font-bold" data-i18n="company_name">Ale Brokering</span>
      </a>
      <div class="relative">
        <button id="langBtn" class="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-primary-700 text-sm"><i class="fas fa-globe"></i> <span id="currentLang">EN</span></button>
        <div id="langMenu" class="hidden absolute right-0 mt-2 w-32 bg-white text-gray-800 rounded-lg shadow-xl py-1 z-50">
          <button onclick="setLanguage('en')" class="w-full text-left px-4 py-2 hover:bg-gray-100">English</button>
          <button onclick="setLanguage('am')" class="w-full text-left px-4 py-2 hover:bg-gray-100">አማርኛ</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 py-10 max-w-2xl">
    <h1 class="text-2xl font-bold text-primary-600 mb-6 text-center" data-i18n="post_wanted">Post Wanted Request</h1>
    <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8">
      <form onsubmit="handlePostWanted(event)">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">Title</label>
            <input type="text" id="wantedTitle" required class="w-full border rounded-lg px-4 py-2.5" placeholder="What are you looking for?">
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">Purpose</label>
              <select id="wantedPurpose" class="w-full border rounded-lg px-4 py-2.5">
                <option value="sale">Buy</option>
                <option value="rent">Rent</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Type</label>
              <select id="wantedType" class="w-full border rounded-lg px-4 py-2.5">
                <option value="property">Property</option>
                <option value="villa">Villa</option>
                <option value="condo">Condominium</option>
                <option value="guest_house">Guest House</option>
                <option value="land">Land</option>
                <option value="store">Store</option>
                <option value="building">Building</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">Max Price (ETB)</label>
              <input type="number" id="wantedPrice" required class="w-full border rounded-lg px-4 py-2.5">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Bedrooms</label>
              <input type="number" id="wantedBedrooms" min="0" class="w-full border rounded-lg px-4 py-2.5">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Location</label>
            <input type="text" id="wantedLocation" required class="w-full border rounded-lg px-4 py-2.5">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Full Description</label>
            <textarea id="wantedDescription" required rows="4" class="w-full border rounded-lg px-4 py-2.5" placeholder="Describe exactly what you need..."></textarea>
          </div>
        </div>
        <button type="submit" class="w-full mt-6 bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 rounded-lg">Submit Request</button>
      </form>
    </div>
  </main>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!getCurrentUser()) { alert('Please login first'); window.location.href='login.html'; }
    });
  </script>
</body>
</html>
